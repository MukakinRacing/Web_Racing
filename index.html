<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>web_racing</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/meshoptimizer@0.21.0/meshopt_decoder.js"></script>

    <style>
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background: #87ceeb; 
            font-family: sans-serif; 
            user-select: none; 
            -webkit-user-select: none; 
            touch-action: none; 
        }
        #game-canvas { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        #loading { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: white; 
            font-size: 24px; 
            z-index: 10;
            font-family: monospace;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }

        @keyframes placeholder-dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }
        .dots::after {
            content: '';
            animation: placeholder-dots 1.5s infinite steps(1);
        }

        .ui-btn {
            position: absolute; 
            width: 90px; 
            height: 90px; 
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5); 
            border-radius: 50%; 
            color: #333;
            font-size: 32px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            touch-action: none; 
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .ui-btn:active { 
            background: rgba(255, 255, 255, 0.5); 
        }
        #btn-left { bottom: 40px; left: 40px; }
        #btn-right { bottom: 40px; left: 160px; }
        #btn-accel { 
            bottom: 140px; 
            right: 50px; 
            background: rgba(0, 255, 100, 0.4); 
            border-color: rgba(0, 255, 100, 0.6); 
            color: white;
        }
        #btn-brake { 
            bottom: 30px; 
            right: 50px; 
            background: rgba(255, 50, 50, 0.4); 
            border-color: rgba(255, 50, 50, 0.6); 
            color: white;
        }

        #hud { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #222; 
            font-size: 24px; 
            font-family: monospace; 
            z-index: 5; 
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <div id="loading">Loading<span class="dots"></span></div>

    <div id="hud">
        <div style="color: #ff3300; font-weight: bold;">911 GT3 R</div>
        <div><span id="speed">0</span> km/h</div>
    </div>

    <button class="ui-btn" id="btn-left">←</button>
    <button class="ui-btn" id="btn-right">→</button>
    <button class="ui-btn" id="btn-accel">▲</button>
    <button class="ui-btn" id="btn-brake">▼</button>

    <canvas id="game-canvas"></canvas>

    <script>
        const canvas = document.getElementById('game-canvas');
        const scene = new THREE.Scene();
        
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1500);
        
        const renderer = new THREE.WebGLRenderer({ 
            canvas: canvas, 
            antialias: true,
            logarithmicDepthBuffer: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(20, 40, 20);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffeebb, 0.3);
        dirLight2.position.set(-20, 20, -20);
        scene.add(dirLight2);

        let carSpeed = 0;
        let carAngle = 0;

        const MAX_SPEED = 0.8;
        const ACCEL = 0.012;
        const BRAKE = 0.025;
        const FRICTION = 0.005;
        const TURN_SPEED = 0.025;

        let camAngleX = 0;
        let camAngleY = 2; 
        let isDragging = false;
        let prevX = 0;
        let prevY = 0;

        document.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isDragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
        });
        document.addEventListener('pointermove', (e) => {
            if (isDragging) {
                camAngleX -= (e.clientX - prevX) * 0.01; 
                camAngleY += (e.clientY - prevY) * 0.01; 
                if (camAngleY < 0.1) camAngleY = 0.1;
                if (camAngleY > 5) camAngleY = 5;
                prevX = e.clientX;
                prevY = e.clientY;
            }
        });
        document.addEventListener('pointerup', () => {
            isDragging = false;
        });

        const controls = { left: false, right: false, accel: false, brake: false };

        const setupButton = (id, action) => {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', () => { controls[action] = true; });
            btn.addEventListener('pointerup', () => { controls[action] = false; });
            btn.addEventListener('pointerleave', () => { controls[action] = false; });
        };
        setupButton('btn-left', 'left');
        setupButton('btn-right', 'right');
        setupButton('btn-accel', 'accel');
        setupButton('btn-brake', 'brake');

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') controls.accel = true;
            if (e.key === 'ArrowDown' || e.key === 's') controls.brake = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') controls.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') controls.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') controls.accel = false;
            if (e.key === 'ArrowDown' || e.key === 's') controls.brake = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') controls.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') controls.right = false;
        });

        let porsche = null;

        const loader = new THREE.GLTFLoader();
        loader.setMeshoptDecoder(window.MeshoptDecoder);

        loader.load(
            './911GT3R.glb',
            function (gltf) {
                porsche = gltf.scene;
                porsche.position.set(0, 0, 0);
                porsche.rotation.y = -Math.PI / 2;
                scene.add(porsche);

                const loadingScreen = document.getElementById('loading');
                if (loadingScreen) loadingScreen.style.display = 'none';
            },
            undefined,
            function (error) {
                console.error('読み込み中にエラーが発生しました:', error);
            }
        );

        const roadGeo = new THREE.PlaneGeometry(15, 25000);
        const roadMat = new THREE.MeshBasicMaterial({ 
            color: 0x2e2e2e,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1 
        });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        const groundGeo = new THREE.PlaneGeometry(2000, 25000);
        const groundMat = new THREE.MeshBasicMaterial({ 
            color: 0x3b7a57,
            polygonOffset: true,
            polygonOffsetFactor: 2,
            polygonOffsetUnits: 2
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        for (let i = -500; i < 500; i++) {
            const lineGeo = new THREE.PlaneGeometry(0.3, 8);
            const lineMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff,
                polygonOffset: true,
                polygonOffsetFactor: 0, 
                polygonOffsetUnits: 0
            });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0, i * 25);
            scene.add(line);
        }

        const speedElement = document.getElementById('speed');

        function animate() {
            requestAnimationFrame(animate);

            if (controls.accel) {
                carSpeed += ACCEL;
                if (carSpeed > MAX_SPEED) carSpeed = MAX_SPEED;
            } else if (controls.brake) {
                carSpeed -= BRAKE;
                if (carSpeed < -MAX_SPEED * 0.3) carSpeed = -MAX_SPEED * 0.3;
            } else {
                if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - FRICTION);
                if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + FRICTION);
            }

            if (Math.abs(carSpeed) > 0.01) {
                const turnFactor = carSpeed > 0 ? 1 : -1;
                if (controls.left) carAngle += TURN_SPEED * turnFactor * (Math.abs(carSpeed) / MAX_SPEED + 0.3);
                if (controls.right) carAngle -= TURN_SPEED * turnFactor * (Math.abs(carSpeed) / MAX_SPEED + 0.3);
            }

            if (porsche) {
                porsche.rotation.y = carAngle - Math.PI / 2;
                porsche.position.x += Math.sin(carAngle) * carSpeed;
                porsche.position.z += Math.cos(carAngle) * carSpeed;

                const radius = 6.5;
                camera.position.x = porsche.position.x + Math.sin(camAngleX) * radius;
                camera.position.y = porsche.position.y + camAngleY;
                camera.position.z = porsche.position.z + Math.cos(camAngleX) * radius;
                camera.lookAt(porsche.position);
            }

            speedElement.innerText = Math.round(Math.abs(carSpeed) * 350);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
